<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2026 SE X'mas BINGO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Berkshire+Swash&display=swap" rel="stylesheet">
  <style>
    :root {
      font-family: "Microsoft JhengHei", system-ui, sans-serif;
      color: #242a40;
      background: #123d32;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px 16px;
      background:
        radial-gradient(circle, #d6ae5b 3px, transparent 3.5px) 20px 50px / 180px 180px,
        radial-gradient(ellipse at top, #276c4e, #123d32 70%);
      background-attachment: fixed;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle, #ffffffcc 2px, transparent 2.5px),
        radial-gradient(circle, #ffffff99 3px, transparent 3.5px),
        radial-gradient(circle, #ffffff80 1.5px, transparent 2px);
      background-size: 100px 100px, 150px 150px, 200px 200px;
      background-position: 0 0, 40px 30px, 80px 70px;
      animation: snowfall 18s linear infinite;
    }
    @keyframes snowfall {
      to { background-position: 0 600px, 40px 630px, 80px 670px; }
    }
    body::after {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background: radial-gradient(ellipse at 50% 0%, #f4d58e22, transparent 55%),
                  radial-gradient(ellipse at 50% 100%, #071d1a88, transparent 65%);
    }
    .light-string {
      position: absolute; top: -24px; left: 0; width: 100%; height: 75px;
      display: flex; justify-content: space-around; align-items: flex-start;
      border-top: 3px solid #254b31; border-radius: 0 0 50% 50%;
      pointer-events: none; overflow: hidden;
    }
    .light-string span { position: relative; display: block; width: 13px; height: 22px; margin-top: 18px; border-radius: 45% 45% 55% 55%; transform: rotate(-12deg); background: #ffd36d; box-shadow: 0 0 15px 4px #ffd36d77; animation: twinkle 2.6s ease-in-out infinite alternate; }
    .light-string span::before { content: ""; position: absolute; width: 9px; height: 7px; left: 2px; top: -6px; border-radius: 2px; background: #48604c; }
    .light-string span:nth-child(4n+2) { background: #e84c51; box-shadow: 0 0 14px 4px #e84c5177; animation-delay: -.7s; }
    .light-string span:nth-child(4n+3) { background: #b8e7cf; box-shadow: 0 0 14px 4px #b8e7cf88; animation-delay: -1.5s; }
    .light-string span:nth-child(4n) { background: #e5b8f5; box-shadow: 0 0 14px 4px #e5b8f577; animation-delay: -2s; }
    @keyframes twinkle { from { opacity: .6; filter: brightness(.85) } to { opacity: 1; filter: brightness(1.2) } }
    .holiday-header { position: relative; text-align: center; min-height: 255px; padding: 66px 190px 30px; }
    .holiday-kicker { display: inline-block; color: #f6d99c; font-size: .76rem; font-weight: 900; letter-spacing: .35em; margin: 0 0 8px; }
    .header-wreath { font-size: 2.9rem; line-height: 1; display: block; margin-bottom: 5px; filter: drop-shadow(0 5px 5px #081d1699); }
    .holiday-divider { display: flex; align-items: center; justify-content: center; gap: 12px; color: #f0ca76; margin: 10px auto 0; font-size: 1rem; }
    .holiday-divider::before, .holiday-divider::after { content: ""; height: 1px; width: 100px; max-width: 20%; background: linear-gradient(90deg, transparent, #d4b877); }
    .holiday-divider::after { transform: rotate(180deg); }
    .christmas-parade {
      position: absolute; top: 27px; left: 0; right: 0;
      display: flex; align-items: center; justify-content: space-between;
      height: 260px; padding: 0 8px; pointer-events: none;
    }
    .holiday-character {
      position: relative; width: 210px; height: 255px;
      display: grid; place-items: center;
      background: radial-gradient(ellipse at center, #ffe7a62e 0, #ffe7a600 67%);
    }
    .holiday-character .character-image {
      display: block; width: 205px; height: 245px; object-fit: contain;
      filter: drop-shadow(0 14px 15px #031b13a3);
      animation: character-bob 3.4s ease-in-out infinite;
    }
    .reindeer-character .character-image { animation-delay: -1.7s; }
    .character-caption { display: none; }
    .reindeer-character .character-caption { transform: translateX(-50%) rotate(4deg); }
    .parade-sparkles { display: none; color: #f8d98c; font-size: clamp(1.2rem, 2.6vw, 2.3rem); letter-spacing: .35em; text-shadow: 0 0 15px #fce7a8a8; }
    @keyframes character-bob { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-10px) rotate(3deg); } }
    .card .corner-ornament { position: absolute; top: 15px; right: 16px; font-size: 1.8rem; transform: rotate(12deg); opacity: .88; pointer-events: none; }
    .draw-area::after { content: "🎁   ✨   🦌"; display: block; font-size: 1.65rem; letter-spacing: .4em; margin-top: 20px; }
    .board-footer { text-align: center; color: #65816a; letter-spacing: .25em; margin: 17px 0 -5px; font-size: 1.05rem; }
    .confetti-layer { position: fixed; inset: 0; z-index: 20; pointer-events: none; overflow: hidden; }
    .confetti-piece {
      position: absolute; width: var(--size); height: calc(var(--size) * 1.6);
      left: var(--start-x); top: var(--start-y); background: var(--color);
      border-radius: 2px; box-shadow: 0 1px 3px #15251b30;
      animation: confetti-burst var(--duration) cubic-bezier(.12,.65,.35,1) forwards;
      will-change: transform, opacity;
    }
    .confetti-piece.round { height: var(--size); border-radius: 50%; }
    @keyframes confetti-burst {
      0% { transform: translate(-50%, -50%) rotate(0deg) scale(.35); opacity: 0; }
      9% { opacity: 1; }
      48% { transform: translate(var(--mid-x), var(--mid-y)) rotate(var(--mid-spin)); opacity: 1; }
      100% { transform: translate(calc(var(--dx) - 50%), var(--dy)) rotate(var(--spin)); opacity: 0; }
    }
    .number.celebrate { animation: number-pop .72s cubic-bezier(.18,1.55,.4,1) both; }
    @keyframes number-pop {
      0% { transform: scale(.62); opacity: .55; filter: brightness(1.4) drop-shadow(0 0 20px #ffe3a0); }
      60% { transform: scale(1.13); opacity: 1; filter: brightness(1.22) drop-shadow(0 0 16px #f7cd64); }
      100% { transform: scale(1); opacity: 1; filter: brightness(1) drop-shadow(0 0 0 transparent); }
    }
    @media (prefers-reduced-motion: reduce) {
      body::before, .light-string span, .number.celebrate, .confetti-piece, .character-image { animation: none; }
    }
    main { position: relative; z-index: 1; max-width: 1200px; margin: auto; }
    h1 { margin: 0; text-align: center; color: #fff4d6; font-size: 2.2rem; }
    .subtitle { text-align: center; color: #e2efe5; }
    .game-layout {
      display: grid;
      grid-template-columns: minmax(0, .95fr) minmax(0, .95fr) minmax(0, 1.3fr);
      gap: 20px;
      margin-top: 20px;
      align-items: stretch;
    }
    .card {
      background: white;
      border-radius: 20px;
      box-shadow: 0 8px 30px #25365a18;
      padding: 24px;
    }
    .draw-area { display: flex; flex-direction: column; justify-content: center; text-align: center; position: relative; }
    .label { margin: 0; color: #606a83; font-weight: 700; }
    .number {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 200px;
      min-height: 200px;
      flex: 0 0 200px;
      color: #d71920;
      font-size: clamp(6rem, 18vw, 10rem);
      font-weight: 800;
      line-height: 1;
    }
    .actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin-top: 14px; }
    button {
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      padding: 14px 28px;
      transition: transform .18s ease, filter .18s ease;
    }
    button:hover:not(:disabled) { transform: translateY(-2px); }
    button:focus-visible { outline: 3px solid #f5a623; outline-offset: 3px; }
    #draw { color: white; font-size: 1.2rem; }
    #draw:disabled { background: #aab2c6; cursor: not-allowed; }
    #reset { background: #e9edf7; color: #34446f; }
    #reset:hover { background: #dce3f2; }
    .status { color: #606a83; margin: 18px 0 0; }
    .board-heading { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-top: 85px; }
    /* Visually center the board content without changing either card's height. */
    .board-card > * { position: relative; top: 28px; }
    h2 { font-size: 1.2rem; margin: 0 0 16px; }
    .hint { margin: 0 0 16px; color: #606a83; font-size: .9rem; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
    .board { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 6px; }
    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 1;
      border-radius: 8px;
      background: #f0f2f7;
      color: #7a8295;
      font-weight: 700;
    }
    .cell.drawn { background: #ffebeb; color: #bf151c; }
    .festive-icons { text-align: center; color: #f8d784; font-size: 1.65rem; letter-spacing: .35em; margin-bottom: 8px; }
    h1 { color: #fff6df; text-shadow: 0 3px 0 #9f2027, 0 6px 20px #071e18; font-size: clamp(2rem, 4.4vw, 3.7rem); letter-spacing: .025em; }
    h1.christmas-title {
      font-family: "Berkshire Swash", Georgia, "Times New Roman", serif;
      font-weight: 400;
      font-size: clamp(2.3rem, 5.2vw, 4.35rem);
      line-height: 1.25;
      letter-spacing: .01em;
      text-shadow: 0 3px 0 #94272c, 0 7px 0 #113c2f, 0 12px 22px #061d17a8;
    }
    .christmas-title .title-gold {
      color: #ffe1a0;
      text-shadow: 0 2px 0 #a76b27, 0 5px 0 #80262a, 0 9px 18px #071e18;
    }
    .christmas-title .title-star {
      color: #f7d888;
      font-family: Georgia, serif;
      font-size: .38em;
      display: inline-block;
      vertical-align: .35em;
      margin: 0 .15em;
      text-shadow: 0 0 14px #ffe6a0;
      animation: star-glimmer 3.1s ease-in-out infinite alternate;
    }
    .christmas-title .title-star:last-child { animation-delay: -1.5s; }
    @keyframes star-glimmer { from { opacity: .65; filter: brightness(.9); } to { opacity: 1; filter: brightness(1.45); } }
    .subtitle { color: #f8e8ba; font-weight: 700; line-height: 1.6; }
    .card {
      position: relative;
      overflow: hidden;
      background: radial-gradient(circle at 50% 0%, #fff0ce 0, #fffaf0 34%, #fffaf0 100%);
      border: 3px solid #dfbd72;
      box-shadow: 0 12px 30px #061d1880, inset 0 0 0 4px #fff,
                  0 0 20px #f9d8893d;
    }
    .card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 7px; background: repeating-linear-gradient(135deg, #bd202b 0 12px, #fff8e8 12px 24px, #217449 24px 36px, #fff8e8 36px 48px); }
    .label, .hint, .status { color: #52685b; }
    .draw-area .label {
      align-self: center;
      transform: translateY(8px);
      padding: 7px 17px;
      border: 1px solid #e6c985;
      border-radius: 999px;
      background: linear-gradient(90deg, #fff5de, #fffdf5, #fff5de);
      color: #87512c;
      box-shadow: 0 2px 9px #dba65124;
    }
    .board-heading .hint { color: #c52531; font-size: 1.05rem; font-weight: 700; }
    .number {
      font-family: "Berkshire Swash", Georgia, "Times New Roman", serif;
      font-weight: 400;
      font-variant-numeric: lining-nums;
      color: #bd202b;
      text-shadow: 0 2px 0 #fff0c2, 2px 5px 0 #e9c477, 4px 8px 0 #a97037,
                   0 12px 14px #57372655, 0 0 22px #f7d98477;
    }
    .number.is-empty { position: relative; text-shadow: none; }
    .number { position: relative; isolation: isolate; }
    .number.has-photo { justify-content: center; padding-left: 0; }
    .photo-card { display: grid; grid-template-rows: minmax(0, 1fr) auto minmax(0, 1fr); justify-items: center; align-items: center; text-align: center; min-width: 0; position: relative; isolation: isolate; }
    .festive-icon-zone { position: relative; width: 100%; height: 100%; pointer-events: none; overflow: hidden; }
    .festive-sprite { position: absolute; display: block; width: 55px; height: 55px; background: url('./festive-icons-transparent.png') no-repeat; background-size: 384px 128px; background-position: calc(var(--icon-index) * -55px) -32px; transform: rotate(var(--tilt)); filter: drop-shadow(0 3px 3px #6b4a2333); animation: festive-sparkle .42s ease-out both; }
    .waiting-icon { display: none; }
    .photo-card.waiting .festive-icon-zone { visibility: hidden; }
    .photo-card.waiting .waiting-icon { display: block; }
    .waiting-icon.holly-corner { top: 7%; left: 8%; }
    .waiting-icon.candy-corner { bottom: 7%; right: 8%; }
    @keyframes festive-sparkle { from { opacity: 0; } to { opacity: 1; } }
    .photo-placeholder { color: #648069; font-weight: 700; font-size: 1.2rem; line-height: 1.8; }
    .photo-placeholder .gift { display: block; font-size: 4rem; margin-bottom: 16px; }
    .photo-placeholder[hidden] { display: none; }
    .photo-person { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; min-width: 0; }
    .photo-caption { margin-top: 17px; max-width: 100%; color: #245c3a; font-family: "Noto Sans TC", sans-serif; font-size: clamp(1.1rem, 1.705vw, 1.43rem); font-weight: 800; line-height: 1.25; white-space: nowrap; }
    .photo-caption[hidden] { display: none; }
    .photo-popup {
      position: relative;
      width: min(100%, 350px);
      height: auto;
      aspect-ratio: 1;
      max-height: 70vh;
      object-fit: cover;
      border: 8px solid #f5d78d;
      outline: 4px solid #bc2633;
      outline-offset: 2px;
      border-radius: 24px;
      opacity: 1;
      box-shadow: 0 0 0 3px #24754c, 0 17px 30px #06261d80;
      pointer-events: none;
      animation: none;
    }
    .photo-popup.photo-revealing { animation: photo-appear .72s cubic-bezier(.18,1.55,.4,1) both; }
    .photo-popup[hidden] { display: none; }
    .number .drawn-value { position: relative; z-index: 1; order: 1; }
    .number .drawn-person {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      order: 1;
      min-width: 0;
      width: 100%;
    }
    .number .drawn-person .drawn-value { order: 0; font-size: clamp(6.2rem, 12.4vw, 9.5rem); line-height: .98; }
    .number .drawn-name {
      order: 1;
      margin-top: 17px;
      max-width: 100%;
      color: #245c3a;
      font-family: "Noto Sans TC", sans-serif;
      font-size: clamp(1.1rem, 1.705vw, 1.43rem);
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: .025em;
      text-shadow: none;
      white-space: nowrap;
    }
    @keyframes photo-appear {
      0% { opacity: .55; transform: scale(.62); }
      60% { opacity: 1; transform: scale(1.13); }
      100% { opacity: 1; transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .photo-popup.photo-revealing { animation: none; }
    }
    .number .mistletoe-bells {
      display: block;
      position: absolute;
      left: 50%;
      bottom: 6px;
      width: min(198px, 59.4%);
      max-height: 190px;
      object-fit: contain;
      transform: translateX(-50%);
      filter: drop-shadow(0 7px 9px #734e282a);
    }
    #draw {
      background:
        linear-gradient(180deg, #f86a73 0%, #d52b3c 26%, #aa172a 100%) padding-box,
        repeating-linear-gradient(135deg, #fff8e9 0 10px, #d62d3b 10px 20px) border-box;
      color: #fffaf0;
      border: 7px solid transparent;
      border-radius: 999px;
      padding: 12px 27px;
      box-shadow: inset 0 2px 5px #ffebdd77, inset 0 -3px 5px #70111e99,
                  0 5px 0 #791820, 0 0 14px #f2d18555;
      text-shadow: 0 1px 1px #7a2027;
      letter-spacing: .02em;
    }
    #draw:hover:not(:disabled) { filter: brightness(1.1); }
    #reset {
      position: absolute;
      right: 14px;
      bottom: 12px;
      background: linear-gradient(145deg, #317b54, #145138);
      color: #fff9e9;
      border: 2px solid #e8cb85;
      border-radius: 14px 5px 14px 5px;
      font-size: .56rem;
      min-width: 80px;
      padding: 7px 13px;
      box-shadow: inset 0 0 0 2px #ffffff1f, 0 4px 0 #0d3c2a;
      text-shadow: 0 1px 1px #123d32;
    }
    #reset:hover { background: linear-gradient(145deg, #3a8c60, #1b6345); }
    h2 { color: #245c3a; }
    .cell { background: #e9f1e7; color: #57735d; }
    .cell.drawn { background: #c52531; color: #fff9e9; box-shadow: inset 0 -3px 0 #8e1923, 0 0 0 1px #f0cd83, 0 0 9px #d8374540; }
    @media (prefers-reduced-motion: reduce) {
      .christmas-title .title-star { animation: none; }
      button { transition: none; }
    }
    /* Compact desktop game so the full number board fits a presentation screen. */
    @media (min-width: 1050px) {
      body { padding: 12px 16px; }
      .holiday-header { min-height: 196px; padding: 24px 145px 8px; }
      .header-wreath { font-size: 1.8rem; margin-bottom: 2px; }
      .holiday-kicker { margin-bottom: 2px; }
      h1.christmas-title { font-size: clamp(2.9rem, calc(4.1vw + 15px), 4.5875rem); line-height: 1.12; }
      .subtitle { margin: 7px 0 4px; }
      .holiday-divider { margin-top: 3px; }
      .christmas-parade { top: 8px; height: 196px; }
      .holiday-character { height: 196px; }
      .holiday-character .character-image { height: 191px; width: 188px; }
      .game-layout { margin-top: 6px; gap: 16px; }
      .card { padding: 15px 20px; }
      .board-heading h2, .board-heading .hint { margin-bottom: 9px; }
      .board { gap: 5px; }
      .cell { aspect-ratio: auto; height: clamp(29px, 4.4vh, 48px); }
      .board-footer { margin-top: 6px; }
    }
    /* Fit the entire 98-number board on shorter desktop/projector viewports at 100% zoom. */
    @media (min-width: 1050px) and (max-height: 820px) {
      body { padding-top: 6px; padding-bottom: 8px; }
      main { padding-top: 28px; }
      .holiday-header { min-height: 180px; padding-top: 14px; padding-bottom: 2px; }
      .header-wreath { font-size: 1.5rem; margin-bottom: 0; }
      .holiday-kicker { margin-bottom: 0; }
      .subtitle { margin: 3px 0 1px; }
      .holiday-divider { margin-top: 0; }
      .christmas-parade { top: 28px; height: 180px; }
      .holiday-character { height: 180px; }
      .holiday-character .character-image { height: 176px; width: 178px; }
      .game-layout { margin-top: 0; }
      .card { padding: 10px 18px; }
      .board-heading { margin-top: 14px; }
      .board-heading h2, .board-heading .hint { margin-bottom: 6px; }
      .board { gap: 3px; }
      .cell { height: clamp(24px, 3.8vh, 39px); }
      .board-footer { margin: 5px 0 -5px; }
      .draw-area::after { margin-top: 10px; }
      .status { margin-top: 12px; }
    }
    @media (max-width: 1049px) {
      .game-layout { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
      .board-card { grid-column: 1 / -1; }
      .holiday-header { min-height: 225px; padding: 56px 165px 24px; }
      .christmas-parade { top: 37px; height: 225px; padding: 0 14px; }
      .holiday-character { width: 170px; height: 190px; }
      .holiday-character .character-image { width: 160px; height: 185px; }
    }
    @media (max-width: 700px) {
      .photo-popup { width: min(72%, 320px); border-width: 5px; outline-width: 3px; }
      .photo-card { min-height: 300px; }
      .photo-card { min-height: 440px; }
      .festive-sprite { transform: scale(.8) rotate(var(--tilt)); }
      .board-card { grid-column: auto; }
      .board-heading { margin-top: 14px; }
      .holiday-header { min-height: 0; padding: 56px 80px 12px; }
      .game-layout { grid-template-columns: 1fr; }
      .actions { margin-top: 30px; }
      .christmas-parade { position: relative; top: 35px; left: auto; right: auto; height: 171px; margin: 0 auto 39px; padding: 0 6px; }
      .holiday-character { width: 145px; height: 165px; }
      .holiday-character .character-image { width: 133px; height: 158px; }
      .parade-sparkles { display: block; }
      .parade-sparkles { font-size: 1rem; letter-spacing: .1em; }
      .character-caption { font-size: .65rem; padding: 4px 9px; }
    }
    @media (max-width: 480px) {
      body { padding: 20px 10px; }
      .holiday-header { padding: 48px 38px 10px; }
      .holiday-kicker { letter-spacing: .12em; }
      h1.christmas-title { font-size: clamp(2.35rem, calc(9vw + 4px), 3.35rem); }
      .christmas-title .title-star { margin: 0 .04em; }
      .light-string { top: -16px; }
      .christmas-parade { height: 147px; }
      .holiday-character { width: 125px; height: 141px; }
      .holiday-character .character-image { width: 115px; height: 135px; }
      .parade-sparkles { font-size: .75rem; letter-spacing: 0; }
      .card { padding: 18px 12px; }
      .board { gap: 4px; }
      .cell { border-radius: 5px; font-size: .8rem; }
    }
    /* Reserve visible ornament space outside the photo and name. */
    .photo-card { display: flex; flex-direction: column; justify-content: center; align-items: center; }
    .festive-icon-zone { position: absolute; left: 16px; right: 16px; width: auto; height: 70px; overflow: visible; }
    .festive-icon-zone.top { top: 4%; }
    .festive-icon-zone.bottom { bottom: 2%; }
    .festive-icon-zone .festive-sprite { width: 54px; height: 61px; background: none; object-fit: contain; }
    .waiting-icon.festive-sprite { width: 50px; height: 50px; background: none; object-fit: contain; }
    /* Center the entire number-board group within its equal-height card. */
    .board-card { display: flex; flex-direction: column; justify-content: center; }
    .board-card > * { position: static; top: auto; }
    .board-card .board-heading { margin-top: 0; }
  </style>
</head>
<body>
  <div id="confetti-layer" class="confetti-layer" aria-hidden="true"></div>
  <main>
    <div class="light-string" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
    <header class="holiday-header">
      <span class="header-wreath" aria-hidden="true">🎀🎄🎀</span>
      <p class="holiday-kicker">✦ THE MOST WONDERFUL TIME OF THE YEAR ✦</p>
      <h1 class="christmas-title"><span class="title-star" aria-hidden="true">✦</span>2026 SE <span class="title-gold">X'mas</span> BINGO<span class="title-star" aria-hidden="true">✦</span></h1>
      <p class="subtitle">🎄 Let the X'mas Magic Begin! 1-98 號隨機開抽! 幸運不重複! ✨</p>
      <div class="holiday-divider" aria-hidden="true">❄ ✦ ❄ ✦ ❄</div>
    </header>
    <div class="christmas-parade" aria-hidden="true">
      <div class="holiday-character reindeer-character"><img class="character-image" src="./reindeer-cutout.png" alt=""><span class="character-caption">JINGLE BELLS!</span></div>
      <span class="parade-sparkles">✦ ❄ ✦ ❄ ✦</span>
      <div class="holiday-character santa-character"><img class="character-image" src="./santa-cutout.png" alt=""><span class="character-caption">HO HO HO!</span></div>
    </div>
    <div class="game-layout">
      <section class="card draw-area" aria-label="抽號">
        <span class="corner-ornament" aria-hidden="true">🍬</span>
        <p class="label">✨ 本次抽出的幸運號碼 ✨</p>
        <div id="number" class="number is-empty" aria-live="polite" aria-atomic="true"><img class="mistletoe-bells" src="./mistletoe-bells.png" alt="聖誕槲寄生雙鈴鐺"></div>
        <div class="actions">
          <button id="draw" type="button">🍬 抽出幸運號碼 ✨</button>
          <button id="reset" type="button" aria-label="重新開始抽號">RESET</button>
        </div>
        <p id="status" class="status" aria-live="polite">已抽出 0 個，剩下 98 個</p>
      </section>
      <section class="card photo-card waiting" aria-label="幸運人物照片">
        <img class="festive-sprite waiting-icon holly-corner" src="./icon-holly.png" style="--tilt:-12deg" alt="" aria-hidden="true">
        <img class="festive-sprite waiting-icon candy-corner" src="./icon-candy.png" style="--tilt:12deg" alt="" aria-hidden="true">
        <div class="festive-icon-zone top" id="festive-top" aria-hidden="true"></div>
        <div class="photo-person">
          <div id="photo-placeholder" class="photo-placeholder" aria-hidden="true"><span class="gift">🎁</span>等待幸運人物登場 ✨</div>
          <img id="photo-popup" class="photo-popup" src="./011_William_Huang.png" alt="11 號 William Huang 的照片" hidden>
          <div id="photo-caption" class="photo-caption" hidden></div>
        </div>
        <div class="festive-icon-zone bottom" id="festive-bottom" aria-hidden="true"></div>
      </section>
      <section class="card board-card" aria-label="號碼表">
        <div class="board-heading">
          <h2>🎄 聖誕號碼表</h2>
          <p class="hint"><span aria-hidden="true">🔔</span>紅色代表已抽出</p>
        </div>
        <div id="board" class="board"></div>
        <p class="board-footer" aria-hidden="true">✦ ❄ ✦ 🎄 ✦ ❄ ✦</p>
      </section>
    </div>
  </main>
  <script src="./people.js"></script>
  <script>
    const total = 98;
    const people = window.BINGO_PEOPLE;
    const numberDisplay = document.getElementById("number");
    const photoPopup = document.getElementById("photo-popup");
    const photoCard = document.querySelector(".photo-card");
    const photoPlaceholder = document.getElementById("photo-placeholder");
    const photoCaption = document.getElementById("photo-caption");
    const status = document.getElementById("status");
    const board = document.getElementById("board");
    const drawButton = document.getElementById("draw");
    const resetButton = document.getElementById("reset");
    const confettiLayer = document.getElementById("confetti-layer");
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    const festiveZones = [document.getElementById("festive-top"), document.getElementById("festive-bottom")];
    const festiveIconFiles = ['candy', 'tree', 'holly', 'bell', 'double-bells', 'green-ornament', 'red-ornament'];
    function scatterFestiveIcons(drawnNumber) {
      const choices = [0, 1, 2, 3, 4, 5, 6];
      for (let i = choices.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [choices[i], choices[j]] = [choices[j], choices[i]];
      }
      const count = drawnNumber === 11 ? 2 : 2 + Math.floor(Math.random() * 2);
      const topCount = Math.ceil(count / 2);
      festiveZones.forEach((zone, zoneIndex) => {
        const icons = choices.slice(zoneIndex ? topCount : 0, zoneIndex ? count : topCount);
        const fragment = document.createDocumentFragment();
        icons.forEach((iconIndex, position) => {
          const icon = document.createElement('img');
          icon.className = 'festive-sprite';
          icon.src = `./icon-${festiveIconFiles[iconIndex]}.png`;
          icon.alt = '';
          icon.style.setProperty('--tilt', `${Math.round(Math.random() * 32 - 16)}deg`);
          const sectionWidth = zone.clientWidth / icons.length;
          const x = position * sectionWidth + Math.random() * Math.max(0, sectionWidth - 58);
          icon.style.left = `${Math.max(0, Math.min(zone.clientWidth - 54, x))}px`;
          const maxTop = Math.max(0, zone.clientHeight - 61);
          icon.style.top = `${Math.max(0, Math.min(maxTop, Math.random() * 3))}px`;
          icon.style.animationDelay = `${Math.round(Math.random() * 130)}ms`;
          fragment.appendChild(icon);
        });
        zone.replaceChildren(fragment);
      });
    }
    scatterFestiveIcons();
    const cells = [];
    let remaining = [];
    let drawing = false;

    function fitDrawnName() {
      const name = photoCaption;
      if (name.hidden) return;
      name.style.fontSize = '';
      const normalSize = parseFloat(getComputedStyle(name).fontSize);
      const available = Math.max(1, name.parentElement.clientWidth - 12);
      if (name.scrollWidth > available) {
        name.style.fontSize = `${normalSize * available / name.scrollWidth * .97}px`;
      }
    }
    window.addEventListener('resize', fitDrawnName);
    document.fonts.ready.then(fitDrawnName);

    function celebrateDraw() {
      if (reduceMotion.matches) return;

      numberDisplay.classList.remove("celebrate");
      photoPopup.classList.remove("photo-revealing");
      void numberDisplay.offsetWidth;
      numberDisplay.classList.add("celebrate");
      photoPopup.classList.add("photo-revealing");

      const rect = numberDisplay.getBoundingClientRect();
      const originX = rect.left + rect.width / 2;
      const originY = rect.top + rect.height / 2;
      const colors = ["#c52835", "#24784d", "#ffd56b", "#fffaf0", "#e8a640"];
      const spread = Math.min(window.innerWidth * .42, 430);
      const fragment = document.createDocumentFragment();

      for (let i = 0; i < 65; i++) {
        const piece = document.createElement("span");
        const angle = (Math.PI * 2 * i) / 65 + (Math.random() - .5) * .32;
        const distance = 100 + Math.random() * spread;
        const dx = Math.cos(angle) * distance;
        const dy = Math.sin(angle) * distance * .52 + 190 + Math.random() * 160;
        piece.className = "confetti-piece" + (i % 5 === 0 ? " round" : "");
        piece.style.setProperty("--start-x", `${originX}px`);
        piece.style.setProperty("--start-y", `${originY}px`);
        piece.style.setProperty("--dx", `${dx}px`);
        piece.style.setProperty("--dy", `${dy}px`);
        piece.style.setProperty("--mid-x", `${dx * .68}px`);
        piece.style.setProperty("--mid-y", `${dy * .3 - 85}px`);
        const spin = (Math.random() * 3 + 2) * 360 * (i % 2 ? 1 : -1);
        piece.style.setProperty("--spin", `${spin}deg`);
        piece.style.setProperty("--mid-spin", `${spin * .65}deg`);
        piece.style.setProperty("--size", `${6 + Math.random() * 7}px`);
        piece.style.setProperty("--duration", `${1.35 + Math.random() * .65}s`);
        piece.style.setProperty("--color", colors[i % colors.length]);
        fragment.appendChild(piece);
      }

      confettiLayer.replaceChildren(fragment);
      window.setTimeout(() => {
        // Do not remove confetti from a newer draw.
        if (confettiLayer.firstElementChild === firstPiece) confettiLayer.replaceChildren();
      }, 2200);
      const firstPiece = confettiLayer.firstElementChild;
    }

    for (let number = 1; number <= total; number++) {
      const cell = document.createElement("span");
      cell.className = "cell";
      cell.textContent = number;
      board.appendChild(cell);
      cells.push(cell);
    }

    function resetGame() {
      photoCard.classList.add("waiting");
      remaining = Array.from({ length: total }, (_, index) => index + 1);
      cells.forEach(cell => cell.classList.remove("drawn"));
      numberDisplay.innerHTML = '<img class="mistletoe-bells" src="./mistletoe-bells.png" alt="聖誕槲寄生雙鈴鐺">';
      numberDisplay.classList.add("is-empty");
      numberDisplay.classList.remove("has-photo");
      photoPopup.hidden = true;
      photoPlaceholder.hidden = false;
      photoCaption.hidden = true;
      numberDisplay.classList.remove("celebrate");
      photoPopup.classList.remove("photo-revealing");
      confettiLayer.replaceChildren();
      status.textContent = "已抽出 0 個，剩下 98 個";
      drawButton.disabled = false;
    }

    drawButton.addEventListener("click", async () => {
      if (drawing || !remaining.length) return;
      drawing = true;
      drawButton.disabled = true;
      const index = remaining.length === total
        ? remaining.indexOf(11)
        : Math.floor(Math.random() * remaining.length);
      const number = remaining[index];
      const person = people[number];
      const nextPhoto = new Image();
      nextPhoto.src = `./${person.photo}`;
      try { await nextPhoto.decode(); } catch { /* Keep the draw usable if an image cannot decode. */ }
      remaining.splice(index, 1);
      photoCard.classList.remove("waiting");
      scatterFestiveIcons(number);
      numberDisplay.innerHTML = '<div class="drawn-person"><span class="drawn-value"></span></div>';
      numberDisplay.querySelector('.drawn-value').textContent = number;
      numberDisplay.classList.add("has-photo");
      photoPopup.src = `./${person.photo}`;
      photoPopup.alt = `${number} 號 ${person.name} 的照片`;
      photoPopup.style.objectPosition = number === 10 ? 'center 43%' : 'center';
      photoPopup.hidden = false;
      photoPlaceholder.hidden = true;
      photoCaption.textContent = person.name;
      photoCaption.hidden = false;
      fitDrawnName();
      numberDisplay.classList.remove("is-empty");
      celebrateDraw();
      cells[number - 1].classList.add("drawn");
      status.textContent = `已抽出 ${total - remaining.length} 個，剩下 ${remaining.length} 個`;
      if (remaining.length === 0) {
        status.textContent += "，所有號碼已抽完！";
      }
      drawing = false;
      drawButton.disabled = remaining.length === 0;
    });

    resetButton.addEventListener("click", () => {
      if (remaining.length === total || window.confirm("確定要清除已抽出的號碼並重新開始嗎？")) {
        resetGame();
      }
    });

    resetGame();
  </script>
</body>
</html>
